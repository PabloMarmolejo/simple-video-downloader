<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    a { color: #0f8f77; } a:hover { color: #0b6f5c; }
  </style>
</helmet>
<div style="width: 620px; height: 430px; background: #f3f6f4; color: #1b2622; display: flex; flex-direction: column;">

  <div style="background: #0f8f77; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;">
    <div style="color: #ffffff; font-size: 15px; font-weight: 600;">Descargador de Videos</div>
    <div style="display: flex; background: rgba(255,255,255,0.18); border-radius: 4px; padding: 2px;">
      <div style="background: #ffffff; color: #0f8f77; font-size: 11px; font-weight: 600; padding: 4px 13px; border-radius: 3px;">Simple</div>
      <div style="color: #ffffff; font-size: 11px; padding: 4px 13px;">Completa</div>
    </div>
  </div>

  <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
    <div style="background: #ffffff; border: 1px solid #dde5e1; border-radius: 6px; padding: 12px;">
      <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px;">Que quieres descargar</div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: center; gap: 9px; background: #e9f5f2; border: 1px solid #0f8f77; border-radius: 4px; padding: 9px 11px;">
          <div style="width: 13px; height: 13px; border-radius: 50%; border: 4px solid #0f8f77; background: #ffffff; flex-shrink: 0;"></div>
          <div style="font-size: 12px; font-weight: 600;">Video con la mejor calidad</div>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; border: 1px solid #e6eae8; border-radius: 4px; padding: 9px 11px;">
          <div style="width: 13px; height: 13px; border-radius: 50%; border: 2px solid #b3bdb9; flex-shrink: 0;"></div>
          <div style="font-size: 12px;">Video mas ligero</div>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; border: 1px solid #e6eae8; border-radius: 4px; padding: 9px 11px;">
          <div style="width: 13px; height: 13px; border-radius: 50%; border: 2px solid #b3bdb9; flex-shrink: 0;"></div>
          <div style="font-size: 12px;">Solo el audio (MP3)</div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="background: #0f8f77; color: #ffffff; font-size: 13px; font-weight: 600; padding: 9px 26px; border-radius: 4px;">Descargar</div>
      <div style="border: 1px solid #c4ccc8; color: #94a09b; font-size: 12px; padding: 8px 18px; border-radius: 4px;">Cancelar</div>
    </div>

    <div style="background: #ffffff; border: 1px solid #dde5e1; border-radius: 6px; flex-grow: 1; overflow: hidden;">
      <div style="display: grid; grid-template-columns: 1fr 120px; background: #eaf0ed; padding: 7px 11px; font-size: 10px; font-weight: 600; color: #4f5f59; letter-spacing: 0.3px;">
        <div>TITULO</div><div>ESTADO</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 120px; padding: 8px 11px; font-size: 11px;">
        <div>Big Buck Bunny 60fps 4K</div><div style="color: #0f8f77; font-weight: 600;">Descargando</div>
      </div>
      <div style="height: 3px; background: #eaf0ed; margin: 0 11px;"><div style="width: 64%; height: 3px; background: #0f8f77;"></div></div>
      <div style="display: grid; grid-template-columns: 1fr 120px; padding: 8px 11px; font-size: 11px; background: #fafbfa;">
        <div>Charla sobre fotografia</div><div style="color: #1f8a4c; font-weight: 600;">Completado</div>
      </div>
    </div>
  </div>

  <div style="background: #eaf0ed; border-top: 1px solid #dde5e1; padding: 6px 18px; font-size: 11px; color: #4f5f59;">Descargando 1 de 3</div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
